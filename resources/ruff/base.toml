# ---
# title: ruff configuration file
# ---

# ---

# Target Python version
target-version = "py311"

# Files and directories to include
include = ["src/**/*.py", "tests/**/*.py"]

# Files and directories to ignore
exclude = [".git", ".venv", "build", "dist", "__pycache__"]

[lint]
select = [
    # pycodestyle errors
    "E",
    # pyflakes
    "F",
    # import sorting
    "I",
    # flake8-bugbear
    "B",
    # pyupgrade
    "UP",
]
ignore = [
    # Allow long lines (Black will handle wrapping)
    "E501",
]

[lint.isort]
known-first-party = ["myproject"]
combine-as-imports = true

[format]
# Black-compatible line length
line-length = 88
quote-style = "double"
indent-style = "space"
indent-width = 4

# Ensure Ruff's formatter replaces Black
docstring-code-format = true
