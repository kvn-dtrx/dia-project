general:
  log_level: "INFO"
  # Shared snippet library (dia-resources), wired via `make install`
  # into the XDG data home. XDG_DATA_HOME defaults to ~/.local/share when unset.
  resources: "${XDG_DATA_HOME}/dia/resources"
  # Marker keyword used as `<marker>:begin` / `<marker>:end`.
  marker: "dia"
